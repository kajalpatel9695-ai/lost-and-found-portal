<!DOCTYPE html>
<html>

<head>

    <title>Login - Lost & Found Portal</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- Main Heading -->

    <h1 align="center">
        LOST & FOUND PORTAL
    </h1>


    <!-- Navigation -->

    <table border="1" width="100%" cellpadding="15" cellspacing="0">

        <tr>

            <th>
                <a href="index.html">
                    Home
                </a>
            </th>


            <th>
                <a href="lost.html">
                    Report Lost Item
                </a>
            </th>


            <th>
                <a href="found.html">
                    Report Found Item
                </a>
            </th>


            <th>
                <a href="my-reports.html">
                    My Reports
                </a>
            </th>


            <th>
                <a href="login.html">
                    Login
                </a>
            </th>

        </tr>

    </table>


    <br><br>


    <!-- Login Heading -->

    <h2 align="center">
        LOGIN
    </h2>

    <hr>


    <!-- Login Form -->

    <form id="loginForm">

        <table
            border="1"
            align="center"
            cellpadding="12"
            cellspacing="0"
        >

            <tr>

                <td>
                    <label>Email:</label>
                </td>

                <td>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </td>

            </tr>


            <tr>

                <td>
                    <label>Password:</label>
                </td>

                <td>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </td>

            </tr>


            <tr>

                <td colspan="2" align="center">

                    <button type="submit">
                        LOGIN
                    </button>

                </td>

            </tr>

        </table>

    </form>


    <br>


    <!-- Register Option -->

    <p align="center">

        New user?

        <a href="register.html">
            Register here
        </a>

    </p>


    <br>

    <hr>


    <!-- Footer -->

    <p align="center">
        © 2026 Lost & Found Portal
    </p>


    <!-- JavaScript -->

    <script type="module" src="js/auth.js"></script>

</body>

</html>
