<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Search - Lost & Found</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- Main Heading -->

    <h1 align="center">
        LOST & FOUND PORTAL
    </h1>


    <br>
    <br>


    <!-- Search Heading -->

    <h2 align="center">
        SEARCH LOST & FOUND ITEMS
    </h2>

    <hr>


    <br>


    <!-- Search Box -->

<div class="search-container">

    <div class="search-input-box">

        <span class="search-icon">&#128269;</span>

        <input
            type="text"
            id="searchInput"
            placeholder="Search item, category, location..."
        >

    </div>

    <button id="searchButton">
        Search
    </button>

</div>


    <br>
    <br>


    <!-- Search Results -->

    <div id="searchResults">

    </div>


    <!-- JavaScript -->

    <script
        type="module"
        src="js/search.js"
    ></script>

</body>

</html>
