<!DOCTYPE html>
<html>

<head>
    <title>Report Found Item - Lost & Found Portal</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Main Heading -->
    <h1 align="center">LOST & FOUND PORTAL</h1>


    <!-- Navigation -->
    <table border="1" width="100%" cellpadding="15" cellspacing="0">

        <tr>

            <th>
                <a href="index.html">Home</a>
            </th>

            <th>
                <a href="lost.html">Report Lost Item</a>
            </th>

            <th>
                <a href="found.html">Report Found Item</a>
            </th>

            <th>
                <a href="my-reports.html">My Reports</a>
            </th>

            <th>
                <a href="account.html">Account</a>
            </th>

        </tr>

    </table>

    <br><br>


    <!-- Heading -->
    <h2 align="center">REPORT FOUND ITEM</h2>

    <hr>


    <!-- Found Item Form -->
    <form id="foundItemForm">

        <table border="1" align="center" cellpadding="12" cellspacing="0">

            <tr>
                <td>
                    <label>Item Name:</label>
                </td>

                <td>
                    <input type="text" id="itemName" required>
                </td>
            </tr>


            <tr>
                <td>
                    <label>Category:</label>
                </td>

                <td>

                    <select id="category" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="ID Card">
                            ID Card
                        </option>

                        <option value="Mobile">
                            Mobile
                        </option>

                        <option value="Laptop">
                            Laptop
                        </option>

                        <option value="Calculator">
                            Calculator
                        </option>

                        <option value="Bag">
                            Bag
                        </option>

                        <option value="Book">
                            Book
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </td>
            </tr>


            <tr>
                <td>
                    <label>Found Location:</label>
                </td>

                <td>
                    <input type="text" id="location" required>
                </td>
            </tr>


            <tr>
                <td>
                    <label>Date Found:</label>
                </td>

                <td>
                    <input type="date" id="dateFound" required>
                </td>
            </tr>


            <tr>
                <td>
                    <label>Description:</label>
                </td>

                <td>

                    <textarea
                        id="description"
                        rows="5"
                        cols="30"
                        required>
                    </textarea>

                </td>
            </tr>


            <tr>
                <td>
                    <label>Contact:</label>
                </td>

                <td>
                    <input type="text" id="contact" required>
                </td>
            </tr>


            <tr>
                <td>
                    <label>Upload Photo:</label>
                </td>

                <td>

                    <input
                        type="file"
                        id="itemPhoto"
                        accept="image/*"
                    >

                    <br><br>

                    <img
                        id="photoPreview"
                        width="150"
                        style="display:none;"
                    >

                </td>
            </tr>


            <tr>

                <td colspan="2" align="center">

                    <button type="submit">
                        SUBMIT REPORT
                    </button>

                </td>

            </tr>

        </table>

    </form>

    <br><br>

    <hr>


    <!-- Found Items -->
    <h2 align="center">FOUND ITEMS</h2>

    <div
        id="foundItemsContainer"
        align="center"
    >

        <!-- Found items will appear here -->

    </div>


    <script type="module" src="js/found.js"></script>

</body>

</html>
